services:
  pipeline:
    profiles: ["batch"]
    build: .
    volumes:
      - .:/app
      - ~/.gemini:/root/.gemini
    environment:
      - PYTHONUNBUFFERED=1
      - JOB_SEARCH_ROOT=/app
      - IN_DOCKER=1
      - HOST_PROJECT_ROOT=${PWD}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    shm_size: "2gb"
    command: bash -c "Xvfb :99 -screen 0 1920x1080x24 >/dev/null 2>&1 & sleep 0.4; export DISPLAY=:99; exec python3 -m pipeline.run_pipeline"

  ui:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ~/.gemini:/root/.gemini
    environment:
      - PYTHONUNBUFFERED=1
      - JOB_SEARCH_ROOT=/app
      - IN_DOCKER=1
      - HOST_PROJECT_ROOT=${PWD}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    shm_size: "2gb"
    command: bash -c "Xvfb :99 -screen 0 1920x1080x24 >/dev/null 2>&1 & sleep 0.4; export DISPLAY=:99; exec python3 -m uvicorn web.app:app --host 0.0.0.0 --port 8000"

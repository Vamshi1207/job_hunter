# =============================================================================
# EXAMPLE CONFIG — copy to config.yaml and edit. Never commit config.yaml.
#
#   cp config.example.yaml config.yaml
#
# How loading works:
#   1. The pipeline reads this file first (defaults).
#   2. Then it overlays your private config.yaml (deep merge).
#   3. A list or scalar you set in config.yaml REPLACES the example value
#      (lists are not appended).
#
# Required personal files (all gitignored) are listed in the README.
# LinkedIn password belongs only in gitignored config.yaml. Never log it.
# =============================================================================

# ---------- Workspace paths ----------
workspace:
  # Absolute path for Cursor skills (${WORKSPACE}). The Python pipeline ignores
  # this and uses JOB_SEARCH_ROOT (Docker sets /app) or the repo directory.
  root: /absolute/path/to/this/repo

  # Relative paths (don't change unless you renamed directories)
  master_cv: cv_master.md
  build_script: build.sh
  experience_bank: experience-bank/
  templates: templates/
  applications: applications/
  tracker: applications/_tracker.md
  html_template: resumes/template.html

# ---------- User context (drives Phase 0 / 4 defaults) ----------
user:
  # Your name as it should appear on CV / cover letters
  full_name: "Jane Doe"             # e.g. "Alex Chen"
  preferred_name: "Jane"        # e.g. "Alex"

  # Contact (used when filling application forms in Phase 4)
  email: "jane.doe@example.com"
  phone: "1234567890"                 # in local format
  city: "San Francisco"                  # e.g. "London"
  country: "USA"               # e.g. "UK"
  linkedin: "https://www.linkedin.com/in/jane-doe/"              # full URL
  github: "https://github.com/janedoe/"                # full URL
  website: ""               # optional

# ---------- Career context ----------
career:
  # Career stage drives cover-letter angle, CV length conventions, role expectations
  # Options: junior | mid | senior | career-changer | academic
  stage: senior

  # Honest years in relevant roles. Hunt skips postings that require more than
  # years_experience + hunt.years_buffer.
  years_experience: 5

  # Industry hint — drives template tone + Phase 1 research targets
  # Examples: ai-startup | tech-startup | consulting | banking | academic | media
  industry: tech

  # Target geographic markets (for Phase 1 research scope)
  target_markets:
    - "Canada"
    # - "US"
    # - "EU"

  # Roles you'd take. Hunt uses these as extra search keywords and a ranking
  # boost — the job description stack (hunt.preferred_skills) decides keep/drop.
  target_roles:
    - "Software Engineer"
    - "Forward Deployed Engineer"
    # add yours

# ---------- Visa / work authorisation ----------
# Drives Phase 4 form-question handling. BE HONEST.
visa:
  # Options: citizen | permanent-resident | graduate-visa | h1b | opt | tn | none
  status: "permanent-resident"

  # Free-text description used in cover letters when relevant.
  # Examples:
  # "UK Graduate Visa eligible — no sponsorship required"
  # "US OPT (STEM extension) eligible through Aug 2026; H1B sponsorship needed thereafter"
  # "EU citizen, full work rights"
  description: "Permanent Resident of Canada, no sponsorship required"

  # Will you eventually need sponsorship?
  # Used in Phase 4 when forms ask "Will you require sponsorship in the future?"
  # Recommended answer: "May require in the future" if your status has an end date.
  may_need_future_sponsorship: false

# ---------- CV format ----------
# Every layout rule the renderer and tailor prompt share. Override any key in config.yaml.
cv_format:
  # Target PDF length. Any positive integer.
  # 1 = intern / new-grad / some UK junior CVs
  # 2 = typical mid/senior North American tech (this example)
  # 3+ = academic or long-form CVs
  # Type is not shrunk to fit (except a 1-page target that overflows).
  pages: 2
  page_size: letter          # letter | a4
  density: compact           # compact | comfortable (sets type size, leading, margins)
  page_margin: ""            # e.g. "0.5in 0.6in 0.45in 0.6in" — empty uses density default

  header_align: center       # left | center
  body_align: justify        # left | justify
  hyphenate: true
  show_section_tick: true    # teal tick on section rules

  contact_links: labels      # labels = "LinkedIn" / "GitHub" | urls = full host/path
  phone_format: dashed       # dashed = 555-123-4567 | raw = as stored

  # Sections that must not split across pages (heading stranded with one row = off).
  # Allowed names: skills, education. Jobs/projects may still split.
  keep_together:
    - skills
    - education

  # Body order after the name/contact header.
  section_order:
    - summary
    - experience
    - skills
    - education
    - projects

  bullets:
    max_lines: 2             # tailor prompt: keep each bullet this short

  color:
    ink: "#1C1917"
    accent: "#1B365D"        # name, headings, links
    tick: "#0E7490"
    muted: "#57534E"         # dates, location, contact

  type:
    name_font: Fraunces
    body_font: "IBM Plex Sans"
    name_size: ""            # empty = follow density
    body_size: ""
    line_height: ""
    google_fonts: true
    google_fonts_url: ""     # optional full CSS2 URL; empty = auto from known families

  engine: html-playwright

# ---------- Experience (template job slots) ----------
# Prefixes must match placeholders in resumes/template.html ({{JOB1_TITLE}}, …).
# Copy those employer names into your HTML template. Keep real employers only in config.yaml.
experience:
  jobs:
    - prefix: JOB1
      employer: Example One
      default_title: Software Engineer
      bullets: 7
    - prefix: JOB2
      employer: Example Two
      default_title: Data Engineer
      bullets: 4
    - prefix: JOB3
      employer: Example Three
      default_title: Software Engineer
      bullets: 6

# ---------- Pipeline ----------
pipeline:
  jobs_file: jobs.yaml
  html_template: resumes/template.html
  ats_threshold: 80
  max_attempts: 3
  # nvidia = OpenAI-compatible NVIDIA NIM (NVIDIA_API_KEY). agy = Gemini CLI.
  provider: nvidia
  model: nvidia/nemotron-3-ultra-550b-a55b
  fallback_provider: agy
  fallback_model: gemini-3.1-pro
  workers: 5                 # parallel tailor jobs (stay under nvidia.rpm)
  llm_timeout_seconds: 600
  nvidia:
    base_url: https://integrate.api.nvidia.com/v1
    fallback_model: openai/gpt-oss-120b   # after Nemotron, before agy
    rpm: 40
    max_tokens: 16384
    temperature: 1
    top_p: 0.95
    enable_thinking: true
  # Form fill is off unless you pass --fill-form. Submit is never clicked.
  auto_apply: false

# Public job hunt (desk "Hunt from profile" and `python3 -m pipeline.run_pipeline --hunt`)
# Fit rules are config, not code. Browser hunt uses Camoufox; it never clicks Apply/Submit.
# Only real postings are tailored: Indeed viewjob?jk=, LinkedIn /jobs/view/{id}, ATS job pages.
# Salary guides, career-explorer, search result, and company-review URLs are skipped.
hunt:
  max_jobs: 0                # 0 = tailor every match; >0 is a safety ceiling, not a ranking
  api_sources: true           # The Muse + Remotive public APIs (no extra keys). Fit gates still apply.
  greenhouse_boards: []
  # Example: the Greenhouse board token from boards.greenhouse.io/<token>
  ats_boards: []
  # Direct ATS board URLs for the `ats` source. Do not mix `[]` with list items.
  # - https://boards.greenhouse.io/acme
  # - https://jobs.lever.co/acme
  # - https://jobs.ashbyhq.com/acme
  years_buffer: 2            # skip if JD requires more than years_experience + this
  # Title seniority you will not apply to (unless the same phrase is in target_roles).
  # "staff" skips Staff Engineer; Member of Technical Staff / MTS is still kept.
  exclude_levels:
    - intern
    - internship
    - junior
    - new grad
    - new-grad
    - entry level
    - principal
    - staff
    - distinguished
    - fellow
  # Other title tokens to skip unless they appear in target_roles
  exclude_title_tokens:
    - manager
    - director
    - head of
    - vp of
    - vice president
    - qa
    - quality assurance
    - quality engineer
  # After the JD is loaded: keep only if at least one preferred/require_any skill appears.
  require_any: []
  # Keep + boost when these appear in the JD (titles can be anything).
  # Programming languages here are the strong stack: a C++-only role is dropped
  # for a Python-primary profile. Related languages (TypeScript, Go) can still match.
  # Unclear cases call the LLM (`hunt.stack_llm`).
  preferred_skills:
    - python
    - kafka
    - aws
  stack_llm: true            # if the required language is unclear, ask the LLM to keep/drop
  # Drop if the title names the skill, or the JD requires it (years/must/proficient)
  reject_skills:
    - java
  # Never tailor these employers (company name or job URL). Applies to search and saved jobs.
  # Add brand aliases if a board uses a shorter name (e.g. ForeFlight vs the full employer).
  exclude_companies:
    - Example Current Employer
  # Jobs you saved on LinkedIn/Indeed are treated as matches (fit gates skipped).
  saved_jobs:
    enabled: true
    max: 50                   # how many saved postings to tailor per hunt
    extra: false             # true = tailor saved jobs in addition to hunt.max_jobs (when that cap is set)
    urls: []                 # empty = LinkedIn my-items/saved-jobs + Indeed saved
    # Camoufox clicks Next on saved-jobs pagination until this many unique jobs or the last page.
  # Official Indeed MCP (https://mcp.indeed.com/claude/mcp) uses OAuth in Cursor.
  # Desk Hunt also tries it; if OAuth is missing it continues with Camoufox.
  mcp:
    indeed:
      enabled: true
      url: "https://mcp.indeed.com/claude/mcp"
      timeout_seconds: 12
      headers: {}            # optional, e.g. HasData x-api-key
  browser:
    enabled: true
    engine: camoufox
    # Docker: headed on DISPLAY=:99 (entrypoint Xvfb). The desk noVNC panel at
    # http://127.0.0.1:6080 is that same display — use it for sign-in / 2FA.
    headless: false
    persistent: true         # keep cookies in gitignored .camoufox-profile/
    user_data_dir: .camoufox-profile
    humanize: true
    os: linux                # fingerprint OS: linux inside Docker; macos | windows on a host
    page_delay_ms: 1500
    login_wait_seconds: 300  # pause for sign-in / 2FA in the Camoufox panel
    max_per_source: 40
    queries: []              # empty = first preferred_skill + first target_role
    # Put real credentials only in gitignored config.yaml. Never commit or log them.
    logins:
      linkedin:
        email: ""            # empty = user.email
        password: ""         # LinkedIn password; leave empty to sign in manually in Camoufox
  sources:
    - id: linkedin
      enabled: true
      kind: search
      url: "https://www.linkedin.com/jobs/search/?keywords={query}&location={location}&f_TPR=r604800"
      link_contains:
        - /jobs/view/
    - id: indeed
      enabled: true
      kind: search
      url: "https://ca.indeed.com/jobs?q={query}&l={location}&fromage=7"
      link_contains:
        - /viewjob
        - jk=
    - id: google_ats
      enabled: true
      kind: google_ats
      # Camoufox searches Google: query + site:ATS + Montreal, Canada
      url: "https://www.google.com/search?q={dork}&hl=en&num=20"
      max_queries: 2          # how many hunt.browser.queries / roles to dork
      group_size: 3           # OR-clump site: operators to keep Google searches down
      max_results: 20          # job URLs to open per Google results page
      ats:
        - site:boards.greenhouse.io
        - site:job-boards.greenhouse.io
        - site:jobs.lever.co
        - site:jobs.ashbyhq.com
        - site:myworkdayjobs.com
        - site:jobs.workable.com
        - site:apply.workable.com
        - site:ats.rippling.com
        - site:jobs.smartrecruiters.com
        - site:jobs.jobvite.com
        - site:icims.com
        - site:taleo.net
        - site:successfactors.com
        - site:bamboohr.com
        - site:recruitee.com
        - site:pinpointhq.com
        - site:breezy.hr
        - site:teamtailor.com
        - site:applytojob.com
        - site:eightfold.ai
        - site:wellfound.com
        - site:otta.com
      link_contains:
        - boards.greenhouse.io/
        - job-boards.greenhouse.io/
        - jobs.lever.co/
        - jobs.ashbyhq.com/
        - myworkdayjobs.com/
        - jobs.workable.com/
        - apply.workable.com/
        - ats.rippling.com/
        - smartrecruiters.com/
        - jobs.jobvite.com/
        - icims.com/
        - taleo.net/
        - successfactors.com/
        - bamboohr.com/
        - recruitee.com/
        - pinpointhq.com/
        - breezy.hr/
        - teamtailor.com/
        - applytojob.com/
        - eightfold.ai/
        - wellfound.com/jobs/
        - otta.com/
        - themuse.com/jobs/
    - id: ats
      enabled: true
      kind: boards
      boards: []             # filled from hunt.ats_boards if empty

# ---------- Output format ----------
output:
  cover_letter_format: md
  date_format: "YYYY-MM-DD"  # for application folder naming

# ---------- Phase 6 outreach defaults ----------
outreach:
  linkedin_dm_max_words: 60
  cold_email_max_words: 200
  signoff: "— Jane"                # e.g. "— Alex"

# Copy to jobs.yaml (gitignored). The desk UI also appends jobs here when you run tailor.
#
#   cp jobs.example.yaml jobs.yaml
#
# CLI: paste the full JD under `jd`. LinkedIn pages are often not scrapeable without Camoufox.
# Desk: paste URL(s) and optionally the job description; with one URL the pasted text is used.
# Use a posting URL (Greenhouse/Lever/Ashby, LinkedIn /jobs/view/{id}, Indeed viewjob?jk=).
# Hunt skips salary guides and search pages such as indeed.com/career/.../salaries/...

jobs:
  - company: ExampleCorp
    role: Senior Software Engineer
    location: Remote, Canada
    url: https://boards.greenhouse.io/examplecorp/jobs/123
    jd: |
      Senior Software Engineer. 5+ years Python, Kafka, distributed systems.
      Remote in Canada. Paste the full posting here.

services:
  pipeline:
    profiles: ["batch"]
    build: .
    volumes:
      - .:/app
      - ~/.gemini:/root/.gemini
    environment:
      - PYTHONUNBUFFERED=1
      - JOB_SEARCH_ROOT=/app
      - IN_DOCKER=1
      - HOST_PROJECT_ROOT=${PWD}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - DISPLAY=:99
      - MOZ_DISABLE_CONTENT_SANDBOX=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "2gb"
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN
    command: ["python3", "-m", "pipeline.run_pipeline"]

  ui:
    build: .
    ports:
      - "8000:8000"
      - "127.0.0.1:6080:6080"
    volumes:
      - .:/app
      - ~/.gemini:/root/.gemini
    environment:
      - PYTHONUNBUFFERED=1
      - JOB_SEARCH_ROOT=/app
      - IN_DOCKER=1
      - HOST_PROJECT_ROOT=${PWD}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - DISPLAY=:99
      - MOZ_DISABLE_CONTENT_SANDBOX=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "2gb"
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN
    command: ["python3", "-m", "uvicorn", "web.app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

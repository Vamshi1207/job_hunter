# Workspace configuration for job-hunt-skill
# Edit each section to match your context. The skill reads this to behave correctly.

# ---------- Workspace paths ----------
workspace:
  # Absolute path to this workspace directory.
  # The skills resolve all other paths relative to this.
  root: /Users/vamshi/Projects/job_search

  # Relative paths (don't change unless you renamed directories)
  master_cv: cv_master.md
  build_script: build.sh
  experience_bank: experience-bank/
  templates: templates/
  applications: applications/
  tracker: applications/_tracker.md
  html_template: resumes/template.html

# ---------- User context (drives Phase 0 / 4 defaults) ----------
user:
  # Your name as it should appear on CV / cover letters
  full_name: "Jane Doe"             # e.g. "Alex Chen"
  preferred_name: "Jane"        # e.g. "Alex"

  # Contact (used when filling application forms in Phase 4)
  email: "jane.doe@example.com"
  phone: "1234567890"                 # in local format
  city: "San Francisco"                  # e.g. "London"
  country: "USA"               # e.g. "UK"
  linkedin: "https://www.linkedin.com/in/jane-doe/"              # full URL
  github: "https://github.com/janedoe/"                # full URL
  website: ""               # optional

# ---------- Career context ----------
career:
  # Career stage drives cover-letter angle, CV length conventions, role expectations
  # Options: junior | mid | senior | career-changer | academic
  stage: senior

  # Industry hint — drives template tone + Phase 1 research targets
  # Examples: ai-startup | tech-startup | consulting | banking | academic | media
  industry: tech

  # Target geographic markets (for Phase 1 research scope)
  target_markets:
    - "Canada"
    # - "US"
    # - "EU"

  # Roles you'd take (used for tailoring About + Skills variants)
  target_roles:
    - "Software Engineer"
    - "Forward Deployed Engineer"
    # add yours

# ---------- Visa / work authorisation ----------
# Drives Phase 4 form-question handling. BE HONEST.
visa:
  # Options: citizen | permanent-resident | graduate-visa | h1b | opt | tn | none
  status: "permanent-resident"

  # Free-text description used in cover letters when relevant.
  # Examples:
  # "UK Graduate Visa eligible — no sponsorship required"
  # "US OPT (STEM extension) eligible through Aug 2026; H1B sponsorship needed thereafter"
  # "EU citizen, full work rights"
  description: "Permanent Resident of Canada, no sponsorship required"

  # Will you eventually need sponsorship?
  # Used in Phase 4 when forms ask "Will you require sponsorship in the future?"
  # Recommended answer: "May require in the future" if your status has an end date.
  may_need_future_sponsorship: false

# ---------- CV format ----------
# Every layout rule the renderer and tailor prompt share. Override any key in config.yaml.
cv_format:
  # Target PDF length. Any positive integer.
  # 1 = intern / new-grad / some UK junior CVs
  # 2 = typical mid/senior North American tech (this example)
  # 3+ = academic or long-form CVs
  # Type is not shrunk to fit (except a 1-page target that overflows).
  pages: 2
  page_size: letter          # letter | a4
  density: compact           # compact | comfortable (sets type size, leading, margins)
  page_margin: ""            # e.g. "0.5in 0.6in 0.45in 0.6in" — empty uses density default

  header_align: center       # left | center
  body_align: justify        # left | justify
  hyphenate: true
  show_section_tick: true    # teal tick on section rules

  contact_links: labels      # labels = "LinkedIn" / "GitHub" | urls = full host/path
  phone_format: dashed       # dashed = 555-123-4567 | raw = as stored

  # Sections that must not split across pages (heading stranded with one row = off).
  # Allowed names: skills, education. Jobs/projects may still split.
  keep_together:
    - skills
    - education

  # Body order after the name/contact header.
  section_order:
    - summary
    - experience
    - skills
    - education
    - projects

  bullets:
    max_lines: 2             # tailor prompt: keep each bullet this short

  color:
    ink: "#1C1917"
    accent: "#1B365D"        # name, headings, links
    tick: "#0E7490"
    muted: "#57534E"         # dates, location, contact

  type:
    name_font: Fraunces
    body_font: "IBM Plex Sans"
    name_size: ""            # empty = follow density
    body_size: ""
    line_height: ""
    google_fonts: true
    google_fonts_url: ""     # optional full CSS2 URL; empty = auto from known families

  engine: html-playwright

# ---------- Experience (template job slots) ----------
# Prefixes must match placeholders in resumes/template.html ({{JOB1_TITLE}}, …).
# Keep personal employers in your private config.yaml, not in git.
experience:
  jobs:
    - prefix: JOB1
      employer: Example One
      default_title: Software Engineer
      bullets: 7
    - prefix: JOB2
      employer: Example Two
      default_title: Data Engineer
      bullets: 4
    - prefix: JOB3
      employer: Example Three
      default_title: Software Engineer
      bullets: 6

# ---------- Pipeline ----------
pipeline:
  jobs_file: jobs.yaml
  html_template: resumes/template.html
  ats_threshold: 80
  max_attempts: 3
  model: gemini-3.1-pro
  llm_timeout_seconds: 600
  # Form fill is off unless you pass --fill-form. Submit is never clicked.
  auto_apply: false

# ---------- Output format ----------
output:
  cover_letter_format: md
  date_format: "YYYY-MM-DD"  # for application folder naming

# ---------- Phase 6 outreach defaults ----------
outreach:
  linkedin_dm_max_words: 60
  cold_email_max_words: 200
  signoff: "— Jane"                # e.g. "— Alex"
